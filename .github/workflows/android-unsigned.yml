name: Android unsigned APK
on:
  workflow_dispatch:
  push:
    branches: [feature/server-playlists]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned release
        run: bash tools/build-release.sh --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: Lyra-unsigned-for-local-signing
          path: dist/unsigned/
          if-no-files-found: error
