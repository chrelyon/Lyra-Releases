name: Lyra Android 1.0.9 (unsigned CI)
on:
  push:
    branches:
      - release/1.0.9-android-auto-mode-and-monitor
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyra-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 37
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :innertube:testDebugUnitTest :app:assembleDebug
      - name: Validate release version and unsigned debug APK
        shell: bash
        run: |
          grep -q 'versionCode = 47' app/build.gradle.kts
          grep -q 'versionName = "1.0.9"' app/build.gradle.kts
          test -s app/build/outputs/apk/debug/app-debug.apk
          test ! -e keystore.properties
          test ! -e release-signing.sha256
      - name: Upload unsigned debug candidate
        uses: actions/upload-artifact@v4
        with:
          name: lyra-1.0.9-unsigned-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
