name: Android 1.0.8 verified playlists (unsigned checks)
on:
  push:
    branches:
      - release/1.0.8-verified-playlists-rc
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A push and its pull request often trigger identical builds. Only the latest
# release-candidate check needs to consume an Android SDK runner.
concurrency:
  group: lyra-android-verified-1.0.8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 37 on runner SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :innertube:testDebugUnitTest :app:assembleDebug
      - name: Ensure version and unsigned APK
        shell: bash
        run: |
          grep -q 'versionCode = 46' app/build.gradle.kts
          grep -q 'versionName = "1.0.8"' app/build.gradle.kts
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Archive unsigned debug APK for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lyra-1.0.8-unsigned-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
